services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false   # .env がなくても起動できる (CI・テスト時)
    environment:
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
    volumes:
      - ./backend:/app
      - ./evals:/evals
      - ./.env:/app/.env
    depends_on:
      - chromadb

  chromadb:
    image: chromadb/chroma:0.5.23
    ports:
      - "8001:8000"
    volumes:
      - ./chroma_data:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules      # node_modules はコンテナ内のみ (ホストと分離)
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend

  # pytest runner: docker compose run --rm pytest
  pytest:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace
    environment:
      - OPENAI_API_KEY=test-key
      - CHROMA_HOST=localhost
      - CHROMA_PORT=8001
    entrypoint: ["python", "-m", "pytest", "backend/tests", "data/test_ingest.py", "-v"]
